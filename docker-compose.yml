version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: p2p-gpu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gpu_user
      POSTGRES_PASSWORD: gpu_password
      POSTGRES_DB: p2p_gpu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gpu_user -d p2p_gpu"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
